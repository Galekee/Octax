{% extends 'base.html' %}
{% block content %}<section class="sales-page"><div class="sales-heading"><div><span class="sales-eyebrow">OCTAX / WORKSPACE</span><h1>{{ title }}</h1></div></div><div class="sales-panel sales-form-panel"><form method="post">{% csrf_token %}{% for field in form %}<div class="sales-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<small class="sales-error">{{ error }}</small>{% endfor %}</div>{% endfor %}<div class="sales-form-actions"><button class="button" type="submit">Сохранить</button><a href="{% url 'sales_list' kind %}">Отмена</a></div></form></div></section>{% endblock %}

name: OCTAX CI
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt ruff
      - name: Python syntax
        run: python -m compileall -q agile crm finance delivery sales smartcrm
      - name: Linter (critical errors)
        run: ruff check agile crm delivery finance sales smartcrm --select E4,E7,E9,F63,F7,F82
      - name: Django configuration
        run: python manage.py check
      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Database migrations
        run: python manage.py migrate --noinput
      - name: Test suite
        run: python manage.py test
      - name: Publish build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octax-source
          path: |
            agile/
            crm/
            delivery/
            finance/
            sales/
            smartcrm/
            static/
            templates/
            docs/
            manage.py
            requirements.txt
